<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>AcronymDB</title>
<script>
  // Apply theme before paint to avoid flash. Stored choice wins; otherwise follow system.
  (function () {
    try {
      var stored = localStorage.getItem('acronymdb:theme');
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      var theme = stored || (prefersLight ? 'light' : 'dark');
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #1CC78E;
    --accent-soft: rgba(28, 199, 142, 0.15);
    --accent-dim: rgba(28, 199, 142, 0.35);
    --bg: #0e1117;
    --bg-elev: #161b22;
    --bg-elev-2: #1c232c;
    --bg-translucent: rgba(14, 17, 23, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ebf0;
    --text-muted: #8b95a5;
    --text-faint: #5c6675;
    --danger: #ef4444;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    --drag-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    --modal-backdrop: rgba(0, 0, 0, 0.6);
    --cloud-glow-1: rgba(28, 199, 142, 0.04);
    --cloud-glow-2: rgba(28, 199, 142, 0.03);
    --label-hover-bg: rgba(28, 199, 142, 0.06);
    --label-active-bg: rgba(28, 199, 142, 0.1);
    --label-selected-bg: rgba(28, 199, 142, 0.12);
    --marquee-bg: rgba(28, 199, 142, 0.08);
    --on-accent: #062118;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --accent: #14a878;
    --accent-soft: rgba(20, 168, 120, 0.12);
    --accent-dim: rgba(20, 168, 120, 0.4);
    --bg: #d8dbe2;
    --bg-elev: #e6e8ec;
    --bg-elev-2: #ccd0d8;
    --bg-translucent: rgba(216, 219, 226, 0.85);
    --border: rgba(15, 23, 42, 0.08);
    --border-strong: rgba(15, 23, 42, 0.18);
    --text: #1a1f29;
    --text-muted: #5c6675;
    --text-faint: #8b95a5;
    --danger: #dc2626;
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    --drag-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    --modal-backdrop: rgba(15, 23, 42, 0.4);
    --cloud-glow-1: rgba(20, 168, 120, 0.11);
    --cloud-glow-2: rgba(20, 168, 120, 0.11);
    --label-hover-bg: rgba(20, 168, 120, 0.08);
    --label-active-bg: rgba(20, 168, 120, 0.14);
    --label-selected-bg: rgba(20, 168, 120, 0.16);
    --marquee-bg: rgba(20, 168, 120, 0.1);
    --on-accent: #ffffff;
    --label-color: #0a6e4f;
    --label-opacity: 1;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; color: inherit; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ───── Header ───── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    background: var(--bg-translucent);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; letter-spacing: -0.01em;
    font-size: 15px;
    white-space: nowrap;
  }
  .brand-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .search-wrap {
    flex: 1; max-width: 520px; position: relative;
  }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--text-faint);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 10px 36px 10px 36px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px;
    display: none; align-items: center; justify-content: center;
    border-radius: 6px; color: var(--text-muted);
  }
  .search-clear:hover { background: var(--bg-elev-2); color: var(--text); }
  .search-clear.visible { display: flex; }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-strong); background: var(--bg-elev-2); }
  .btn-primary {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-icon {
    width: 36px; height: 36px; padding: 0;
    justify-content: center;
  }
  .btn-icon svg { width: 16px; height: 16px; }

  /* Theme toggle: show moon in light mode (click to go dark), sun in dark mode (click to go light) */
  #btn-theme .theme-icon-dark { display: none; }
  #btn-theme .theme-icon-light { display: block; }
  [data-theme="light"] #btn-theme .theme-icon-dark { display: block; }
  [data-theme="light"] #btn-theme .theme-icon-light { display: none; }

  /* Smooth theme transitions on the most visible color surfaces */
  body, header, .btn, .chip, .label, .modal, .modal-backdrop, .field input, .field textarea,
  .search-input, .search-results, .search-result, .tooltip, .toast, .selection-bar, .cloud {
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.35); color: var(--danger); }

  /* ───── Search dropdown ───── */
  .search-results {
    position: absolute;
    top: calc(100% + 8px); left: 0; right: 0;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    box-shadow: var(--shadow);
    max-height: 400px;
    overflow-y: auto;
    display: none;
    z-index: 60;
  }
  .search-results.visible { display: block; }
  .search-result {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover, .search-result.active {
    background: var(--bg-elev-2);
  }
  .search-result-term {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 4px;
    color: var(--text);
  }
  .search-result-term mark {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 0 2px;
    border-radius: 2px;
  }
  .search-result-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .search-result-desc mark {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 0 2px;
    border-radius: 2px;
  }
  .search-empty {
    padding: 32px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .search-empty strong { display: block; color: var(--text); margin-bottom: 4px; font-weight: 600; }

  /* ───── Cloud ───── */
  main { position: fixed; top: 64px; left: 0; right: 0; bottom: 0; }
  .cloud {
    position: relative;
    width: 100%; height: 100%;
    overflow: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    background:
      radial-gradient(circle at 20% 20%, var(--cloud-glow-1), transparent 50%),
      radial-gradient(circle at 80% 80%, var(--cloud-glow-2), transparent 50%);
  }
  .cloud-inner {
    position: relative;
    min-width: 100%;
    min-height: 100%;
  }
  .chip {
    position: absolute;
    padding: 8px 14px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    white-space: nowrap;
    transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
    will-change: transform;
    z-index: 2;
  }

  /* Group labels (decorative, not searchable) */
  .label {
    position: absolute;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--label-color, var(--accent));
    opacity: var(--label-opacity, 0.7);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    white-space: nowrap;
    padding: 4px 6px;
    border-radius: 4px;
    transition: opacity 0.15s, background 0.15s, box-shadow 0.15s;
    z-index: 1;
  }
  .label:hover {
    opacity: 1;
    background: var(--label-hover-bg);
  }
  .label.dragging {
    cursor: grabbing;
    opacity: 1;
    background: var(--label-active-bg);
    box-shadow: 0 0 0 1px var(--accent-dim);
    transition: none;
    z-index: 30;
  }
  .label-editor {
    position: absolute;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent);
    background: var(--marquee-bg);
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
    padding: 4px 6px;
    outline: none;
    min-width: 120px;
    z-index: 40;
    caret-color: var(--accent);
  }
  .label-editor::placeholder {
    color: var(--accent);
    opacity: 0.4;
    text-transform: uppercase;
  }
  .label-editor:focus {
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .chip:hover {
    border-color: var(--accent-dim);
    background: var(--bg-elev-2);
  }
  .chip.dragging {
    cursor: grabbing;
    z-index: 30;
    border-color: var(--accent);
    box-shadow: var(--drag-shadow), 0 0 0 3px var(--accent-soft);
    transition: none;
  }
  .chip.selected {
    border-color: var(--accent);
    background: var(--bg-elev-2);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .label.selected {
    opacity: 1;
    background: var(--label-selected-bg);
    box-shadow: 0 0 0 1px var(--accent-dim);
  }

  /* Marquee selection box */
  .marquee {
    position: absolute;
    border: 1px solid var(--accent);
    background: var(--marquee-bg);
    pointer-events: none;
    z-index: 25;
    border-radius: 2px;
  }
  .selection-bar {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center; gap: 12px;
    padding: 8px 8px 8px 16px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    box-shadow: var(--shadow);
    z-index: 90;
    font-size: 12px;
    color: var(--text);
  }
  .selection-bar.visible { display: inline-flex; }
  .selection-bar .count {
    color: var(--accent); font-weight: 600;
  }
  .selection-bar .btn { padding: 6px 12px; font-size: 12px; }
  .chip.focused {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 0 24px var(--accent-dim);
    z-index: 20;
    animation: pulse 1.4s ease-out;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 var(--accent-dim), 0 0 24px var(--accent-dim); }
    50% { box-shadow: 0 0 0 14px transparent, 0 0 24px var(--accent-dim); }
    100% { box-shadow: 0 0 0 4px var(--accent-soft), 0 0 24px var(--accent-dim); }
  }

  /* Empty state */
  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-muted);
    text-align: center;
    padding: 24px;
    pointer-events: none;
  }
  .empty-state h2 {
    font-size: 18px; font-weight: 600; color: var(--text);
    margin-bottom: 8px; letter-spacing: -0.01em;
  }
  .empty-state p { font-size: 13px; max-width: 360px; line-height: 1.6; }
  .empty-state.hidden { display: none; }

  /* ───── Tooltip ───── */
  .tooltip {
    position: fixed;
    z-index: 70;
    max-width: 320px;
    padding: 10px 14px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: var(--shadow);
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-term {
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  /* ───── Modal ───── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: var(--modal-backdrop);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.visible { display: flex; }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    width: 100%; max-width: 560px;
    max-height: calc(100vh - 40px);
    display: flex; flex-direction: column;
    box-shadow: var(--shadow), 0 20px 60px var(--modal-backdrop);
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-footer {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field textarea { resize: vertical; min-height: 90px; line-height: 1.55; }
  .field-error {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    color: #fca5a5;
  }
  .field-error.visible { display: block; }
  .field.has-error input, .field.has-error textarea {
    border-color: rgba(239, 68, 68, 0.5);
  }

  /* Term list (manage panel) */
  .term-list {
    list-style: none;
    margin: 0; padding: 0;
  }
  .term-list-empty {
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .term-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .term-item:last-child { border-bottom: none; }
  .term-item-main { flex: 1; min-width: 0; }
  .term-item-name {
    font-weight: 600; font-size: 13px;
    margin-bottom: 3px;
    word-break: break-word;
  }
  .term-item-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    word-break: break-word;
  }
  .term-item-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .term-item-actions .btn-icon { width: 30px; height: 30px; }
  .term-item-actions .btn-icon svg { width: 14px; height: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(calc(100% + 32px));
    background: var(--bg-elev-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    box-shadow: var(--shadow);
    z-index: 200;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    pointer-events: none;
    opacity: 0;
  }
  .toast.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast.success { border-color: var(--accent-dim); }
  .toast.error { border-color: rgba(239, 68, 68, 0.4); }

  /* Mobile */
  @media (max-width: 640px) {
    header { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
    .brand { font-size: 14px; }
    .brand-text { display: none; }
    .search-wrap { order: 3; flex-basis: 100%; max-width: none; }
    .header-actions .btn-label { display: none; }
    .header-actions .btn { padding: 9px 11px; }
    main { top: 110px; }
    .modal { max-height: calc(100vh - 32px); }
    .modal-header, .modal-body, .modal-footer { padding-left: 16px; padding-right: 16px; }
    .chip { font-size: 13px; padding: 8px 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-text">AcronymDB</span>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" class="search-input" type="search" placeholder="Search terms…" autocomplete="off" spellcheck="false">
    <button id="search-clear" class="search-clear" aria-label="Clear search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div id="search-results" class="search-results" role="listbox"></div>
  </div>
  <div class="header-actions">
    <button id="btn-add" class="btn btn-primary" title="Add term (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span class="btn-label">Add</span>
    </button>
    <button id="btn-manage" class="btn" title="Manage terms">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span class="btn-label">Manage</span>
    </button>
    <button id="btn-theme" class="btn btn-icon" title="Toggle theme" aria-label="Toggle theme">
      <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

<div id="selection-bar" class="selection-bar" role="status">

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ───── Data layer ─────
  const STORAGE_KEY = 'acronymdb:v1';

  /** @typedef {{ id:string, term:string, description:string, x:number|null, y:number|null, createdAt:number, updatedAt:number }} Term */

  const db = {
    /** @type {Term[]} */
    terms: [],
    /** @type {Array<{id:string,text:string,x:number,y:number}>} */
    labels: [],
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.terms)) {
          this.terms = parsed.terms.filter(t => t && typeof t.term === 'string');
        }
        if (parsed && Array.isArray(parsed.labels)) {
          this.labels = parsed.labels.filter(l => l && typeof l.text === 'string');
        }
      } catch (e) {
        console.warn('Failed to load DB:', e);
      }
    },
    save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, terms: this.terms, labels: this.labels }));
      } catch (e) {
        console.error('Failed to save DB:', e);
        toast('Failed to save — storage may be full', 'error');
      }
    },
    findLabelById(id) { return this.labels.find(l => l.id === id); },
    addLabel(text, x, y) {
      const l = {
        id: crypto.randomUUID ? crypto.randomUUID() : 'lid-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9),
        text: text.trim(),
        x, y,
      };
      this.labels.push(l);
      this.save();
      return l;
    },
    updateLabel(id, text) {
      const l = this.findLabelById(id);
      if (!l) return null;
      l.text = text.trim();
      this.save();
      return l;
    },
    setLabelPosition(id, x, y) {
      const l = this.findLabelById(id);
      if (!l) return;
      l.x = x; l.y = y;
      this.save();
    },
    removeLabel(id) {
      const i = this.labels.findIndex(l => l.id === id);
      if (i >= 0) { this.labels.splice(i, 1); this.save(); }
    },
    findByName(name) {
      const norm = name.trim().toLowerCase();
      return this.terms.find(t => t.term.trim().toLowerCase() === norm);
    },
    findById(id) {
      return this.terms.find(t => t.id === id);
    },
    add(term, description) {
      const now = Date.now();
      const t = {
        id: crypto.randomUUID ? crypto.randomUUID() : 'id-' + now + '-' + Math.random().toString(36).slice(2, 9),
        term: term.trim(),
        description: description.trim(),
        x: null, y: null,
        createdAt: now,
        updatedAt: now,
      };
      this.terms.push(t);
      this.save();
      return t;
    },
    update(id, term, description) {
      const t = this.findById(id);
      if (!t) return null;
      t.term = term.trim();
      t.description = description.trim();
      t.updatedAt = Date.now();
      this.save();
      return t;
    },
    setPosition(id, x, y) {
      const t = this.findById(id);
      if (!t) return;
      t.x = x; t.y = y;
      this.save();
    },
    remove(id) {
      const i = this.terms.findIndex(t => t.id === id);
      if (i >= 0) {
        this.terms.splice(i, 1);
        this.save();
      }
    },
    replaceAll(terms) {
      this.terms = terms;
      this.save();
    },
  };

  // ───── DOM refs ─────
  const $ = id => document.getElementById(id);
  const cloudEl = $('cloud');
  const cloudInnerEl = $('cloud-inner');
  const emptyStateEl = $('empty-state');
  const tooltipEl = $('tooltip');
  const searchEl = $('search');
  const searchClearEl = $('search-clear');
  const searchResultsEl = $('search-results');
  const toastEl = $('toast');

  // ───── Word cloud rendering ─────
  /** @type {Map<string, HTMLElement>} term id -> chip element */
  const chipMap = new Map();
  /** @type {Map<string, HTMLElement>} label id -> label element */
  const labelMap = new Map();

  function renderCloud() {
    chipMap.forEach(el => el.remove());
    chipMap.clear();
    labelMap.forEach(el => el.remove());
    labelMap.clear();
    // Selection refers to elements that no longer exist after a re-render
    if (selection.size > 0) { selection.clear(); updateSelectionUI(); }

    if (db.terms.length === 0 && db.labels.length === 0) {
      emptyStateEl.classList.remove('hidden');
      return;
    }
    emptyStateEl.classList.add('hidden');

    // Render labels first so chips render above them in stacking order
    const labelFrag = document.createDocumentFragment();
    db.labels.forEach(l => {
      const el = createLabelEl(l);
      labelMap.set(l.id, el);
      labelFrag.appendChild(el);
    });
    cloudInnerEl.appendChild(labelFrag);

    // Position labels (clamp to bounds)
    requestAnimationFrame(() => clampLabels());

    // First pass: create chips so we can measure their size
    const fragment = document.createDocumentFragment();
    const newChips = [];
    db.terms.forEach(t => {
      const chip = createChip(t);
      chipMap.set(t.id, chip);
      fragment.appendChild(chip);
      newChips.push({ term: t, chip });
    });
    cloudInnerEl.appendChild(fragment);

    // Second pass: position chips that don't have a saved position
    requestAnimationFrame(() => layoutChips(newChips));
  }

  function clampLabels() {
    const { w, h } = getCloudSize();
    labelMap.forEach((el, id) => {
      const l = db.findLabelById(id);
      if (!l) return;
      const cw = el.offsetWidth, ch = el.offsetHeight;
      const x = clamp(l.x, 0, Math.max(0, w - cw));
      const y = clamp(l.y, 0, Math.max(0, h - ch));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
  }

  function createChip(term) {
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.id = term.id;
    el.textContent = term.term;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', term.term + ': ' + term.description);
    attachChipInteractions(el, term);
    return el;
  }

  function getCloudSize() {
    return {
      w: Math.max(cloudEl.clientWidth, 320),
      h: Math.max(cloudEl.clientHeight, 320),
    };
  }

  /**
   * Place chips. Chips with saved positions keep them (clamped to bounds).
   * Chips without saved positions get a non-overlapping random placement.
   */
  function layoutChips(newChips) {
    const { w, h } = getCloudSize();
    const margin = 8;
    /** @type {Array<{x:number,y:number,w:number,h:number}>} placed rects */
    const placed = [];

    // Place pre-positioned chips first
    newChips.forEach(({ term, chip }) => {
      if (term.x != null && term.y != null) {
        const cw = chip.offsetWidth;
        const ch = chip.offsetHeight;
        const x = clamp(term.x, margin, Math.max(margin, w - cw - margin));
        const y = clamp(term.y, margin, Math.max(margin, h - ch - margin));
        chip.style.left = x + 'px';
        chip.style.top = y + 'px';
        placed.push({ x, y, w: cw, h: ch });
      }
    });

    // Place unpositioned chips with overlap avoidance
    newChips.forEach(({ term, chip }) => {
      if (term.x != null && term.y != null) return;
      const cw = chip.offsetWidth;
      const ch = chip.offsetHeight;
      const maxX = Math.max(margin, w - cw - margin);
      const maxY = Math.max(margin, h - ch - margin);

      let x = 0, y = 0;
      let placedOk = false;
      for (let attempt = 0; attempt < 80; attempt++) {
        x = margin + Math.random() * (maxX - margin);
        y = margin + Math.random() * (maxY - margin);
        if (!overlapsAny({ x, y, w: cw, h: ch }, placed, 6)) {
          placedOk = true;
          break;
        }
      }
      // Fallback: just place it (overlap accepted)
      if (!placedOk) {
        x = margin + Math.random() * (maxX - margin);
        y = margin + Math.random() * (maxY - margin);
      }
      chip.style.left = x + 'px';
      chip.style.top = y + 'px';
      placed.push({ x, y, w: cw, h: ch });
      db.setPosition(term.id, x, y);
    });
  }

  function overlapsAny(rect, others, padding = 0) {
    return others.some(o =>
      rect.x < o.x + o.w + padding &&
      rect.x + rect.w + padding > o.x &&
      rect.y < o.y + o.h + padding &&
      rect.y + rect.h + padding > o.y
    );
  }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  // ───── Selection ─────
  /** @type {Set<string>} item ids (chips and labels share the id namespace via maps) */
  const selection = new Set();
  const selectionBarEl = $('selection-bar');
  const selectionCountEl = $('selection-count');

  function getItemEl(id) { return chipMap.get(id) || labelMap.get(id); }
  function isLabelId(id) { return labelMap.has(id); }

  function setItemSelected(id, selected) {
    const el = getItemEl(id);
    if (!el) return;
    if (selected) {
      selection.add(id);
      el.classList.add('selected');
    } else {
      selection.delete(id);
      el.classList.remove('selected');
    }
    updateSelectionUI();
  }
  function clearSelection() {
    Array.from(selection).forEach(id => {
      const el = getItemEl(id);
      if (el) el.classList.remove('selected');
    });
    selection.clear();
    updateSelectionUI();
  }
  function updateSelectionUI() {
    if (selection.size > 0) {
      selectionCountEl.textContent = selection.size;
      selectionBarEl.classList.add('visible');
    } else {
      selectionBarEl.classList.remove('visible');
    }
  }
  $('btn-clear-selection').addEventListener('click', clearSelection);

  // Marquee drag on empty cloud area
  let marqueeEl = null;
  let marqueeState = null;

  cloudInnerEl.addEventListener('pointerdown', e => {
    if (e.target !== cloudInnerEl) return;
    if (e.button !== undefined && e.button !== 0) return;
    const rect = cloudInnerEl.getBoundingClientRect();
    marqueeState = {
      startX: e.clientX - rect.left,
      startY: e.clientY - rect.top,
      cloudLeft: rect.left,
      cloudTop: rect.top,
      pointerId: e.pointerId,
      additive: e.shiftKey || e.metaKey || e.ctrlKey,
      basis: e.shiftKey || e.metaKey || e.ctrlKey ? new Set(selection) : new Set(),
      moved: false,
    };
    try { cloudInnerEl.setPointerCapture(e.pointerId); } catch (_) {}
  });

  cloudInnerEl.addEventListener('pointermove', e => {
    if (!marqueeState) return;
    const x = e.clientX - marqueeState.cloudLeft;
    const y = e.clientY - marqueeState.cloudTop;
    const dx = x - marqueeState.startX;
    const dy = y - marqueeState.startY;
    if (!marqueeState.moved && Math.hypot(dx, dy) < 4) return;
    if (!marqueeState.moved) {
      marqueeState.moved = true;
      if (!marqueeState.additive) clearSelection();
      marqueeEl = document.createElement('div');
      marqueeEl.className = 'marquee';
      cloudInnerEl.appendChild(marqueeEl);
    }
    const left = Math.min(x, marqueeState.startX);
    const top = Math.min(y, marqueeState.startY);
    const w = Math.abs(dx);
    const h = Math.abs(dy);
    marqueeEl.style.left = left + 'px';
    marqueeEl.style.top = top + 'px';
    marqueeEl.style.width = w + 'px';
    marqueeEl.style.height = h + 'px';
    applyMarqueeSelection({ left, top, right: left + w, bottom: top + h }, marqueeState.basis);
  });

  const endMarquee = e => {
    if (!marqueeState) return;
    const moved = marqueeState.moved;
    const additive = marqueeState.additive;
    try { cloudInnerEl.releasePointerCapture(e.pointerId); } catch (_) {}
    if (marqueeEl) { marqueeEl.remove(); marqueeEl = null; }
    marqueeState = null;
    // Plain click on empty area clears selection
    if (!moved && !additive && selection.size > 0) clearSelection();
  };
  cloudInnerEl.addEventListener('pointerup', endMarquee);
  cloudInnerEl.addEventListener('pointercancel', endMarquee);

  function applyMarqueeSelection(rect, basisSet) {
    const inRect = (el) => {
      const ix = parseFloat(el.style.left) || 0;
      const iy = parseFloat(el.style.top) || 0;
      const iw = el.offsetWidth, ih = el.offsetHeight;
      return ix < rect.right && ix + iw > rect.left && iy < rect.bottom && iy + ih > rect.top;
    };
    const evaluate = (map) => {
      map.forEach((el, id) => {
        const should = inRect(el) || basisSet.has(id);
        if (should && !selection.has(id)) {
          selection.add(id); el.classList.add('selected');
        } else if (!should && selection.has(id)) {
          selection.delete(id); el.classList.remove('selected');
        }
      });
    };
    evaluate(chipMap);
    evaluate(labelMap);
    updateSelectionUI();
  }

  /**
   * Selection-aware drag handler shared by chips and labels.
   * If the item is part of a multi-selection, drags all selected items together.
   * Otherwise drags only the item (and clears selection if the item wasn't selected).
   */
  function attachGroupDrag(el, id) {
    let dragState = null;
    let pointerIsDown = false;
    let moved = false;

    el.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;

      // Shift / Ctrl / Cmd + click toggles this item in the selection (no drag)
      if (e.shiftKey || e.metaKey || e.ctrlKey) {
        e.stopPropagation();
        e.preventDefault();
        setItemSelected(id, !selection.has(id));
        return;
      }

      pointerIsDown = true;
      moved = false;

      let groupIds;
      if (selection.has(id) && selection.size > 1) {
        groupIds = Array.from(selection);
      } else {
        if (!selection.has(id)) clearSelection();
        groupIds = [id];
      }

      const initial = groupIds.map(iid => {
        const ie = getItemEl(iid);
        if (!ie) return null;
        return {
          id: iid,
          el: ie,
          isLabel: isLabelId(iid),
          initLeft: parseFloat(ie.style.left) || 0,
          initTop: parseFloat(ie.style.top) || 0,
          w: ie.offsetWidth,
          h: ie.offsetHeight,
        };
      }).filter(Boolean);

      dragState = { startX: e.clientX, startY: e.clientY, initial };
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      hideTooltip();
    });

    el.addEventListener('pointermove', e => {
      if (!pointerIsDown || !dragState) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      if (!moved && Math.hypot(dx, dy) > 4) {
        moved = true;
        dragState.initial.forEach(i => i.el.classList.add('dragging'));
      }
      if (!moved) return;

      const innerW = cloudInnerEl.clientWidth;
      const innerH = cloudInnerEl.clientHeight;
      let cdx = dx, cdy = dy;
      dragState.initial.forEach(i => {
        cdx = clamp(cdx, -i.initLeft, innerW - i.w - i.initLeft);
        cdy = clamp(cdy, -i.initTop, innerH - i.h - i.initTop);
      });
      dragState.initial.forEach(i => {
        i.el.style.left = (i.initLeft + cdx) + 'px';
        i.el.style.top = (i.initTop + cdy) + 'px';
      });
    });

    const finish = e => {
      if (!pointerIsDown) return;
      pointerIsDown = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      if (moved && dragState) {
        dragState.initial.forEach(i => {
          i.el.classList.remove('dragging');
          const x = parseFloat(i.el.style.left) || 0;
          const y = parseFloat(i.el.style.top) || 0;
          if (i.isLabel) db.setLabelPosition(i.id, x, y);
          else db.setPosition(i.id, x, y);
        });
      }
      dragState = null;
    };
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);
  }

  // ───── Chip interactions: drag + tooltip + focus ─────
  function attachChipInteractions(el, termRef) {
    attachGroupDrag(el, termRef.id);

    // Tooltip on hover (mouse only)
    el.addEventListener('mouseenter', () => showTooltip(el, termRef));
    el.addEventListener('mouseleave', hideTooltip);

    // Keyboard accessibility
    el.addEventListener('focus', () => showTooltip(el, termRef));
    el.addEventListener('blur', hideTooltip);
  }

  // ───── Labels ─────
  function createLabelEl(label) {
    const el = document.createElement('div');
    el.className = 'label';
    el.dataset.id = label.id;
    el.textContent = label.text;
    el.title = 'Double-click to edit · drag to move';
    attachLabelInteractions(el, label);
    return el;
  }

  function attachLabelInteractions(el, labelRef) {
    attachGroupDrag(el, labelRef.id);

    el.addEventListener('dblclick', e => {
      e.preventDefault();
      e.stopPropagation();
      const x = parseFloat(el.style.left) || 0;
      const y = parseFloat(el.style.top) || 0;
      el.style.visibility = 'hidden';
      startLabelEdit(x, y, labelRef.id, () => { el.style.visibility = ''; });
    });
  }

  /**
   * Show an inline input at (x, y) on the cloud to create or edit a label.
   * @param {number} x
   * @param {number} y
   * @param {string|null} existingId  null = create new label
   * @param {() => void} [onCancelRestore]  called on cancel for edits, to restore the original element
   */
  function startLabelEdit(x, y, existingId, onCancelRestore) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'label-editor';
    input.placeholder = 'Label';
    input.maxLength = 60;
    input.style.left = x + 'px';
    input.style.top = y + 'px';
    if (existingId) {
      const l = db.findLabelById(existingId);
      if (l) input.value = l.text;
    }
    cloudInnerEl.appendChild(input);
    input.focus();
    input.select();

    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      const txt = input.value.trim();
      input.remove();
      if (commit) {
        if (existingId) {
          if (txt) {
            db.updateLabel(existingId, txt);
            renderCloud();
          } else {
            db.removeLabel(existingId);
            toast('Label deleted', 'success');
            renderCloud();
          }
        } else if (txt) {
          db.addLabel(txt, x, y);
          renderCloud();
        }
      } else if (existingId && onCancelRestore) {
        onCancelRestore();
      }
    };

    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
  }

  // Double-click empty cloud area to create a label
  cloudInnerEl.addEventListener('dblclick', e => {
    if (e.target !== cloudInnerEl) return;
    const rect = cloudInnerEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    startLabelEdit(x, y, null);
  });

  function showTooltip(anchor, term) {
    const fresh = db.findById(term.id);
    if (!fresh) return;
    tooltipEl.innerHTML = '';
    const t = document.createElement('div');
    t.className = 'tooltip-term mono';
    t.textContent = fresh.term.toUpperCase();
    const d = document.createElement('div');
    d.textContent = fresh.description;
    tooltipEl.appendChild(t);
    tooltipEl.appendChild(d);

    // Position tooltip
    const rect = anchor.getBoundingClientRect();
    tooltipEl.style.left = '0px';
    tooltipEl.style.top = '0px';
    tooltipEl.classList.add('visible');
    const tipRect = tooltipEl.getBoundingClientRect();

    let left = rect.left + rect.width / 2 - tipRect.width / 2;
    let top = rect.bottom + 8;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    if (left < 8) left = 8;
    if (left + tipRect.width > vw - 8) left = vw - tipRect.width - 8;
    if (top + tipRect.height > vh - 8) top = rect.top - tipRect.height - 8;
    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
  }
  function hideTooltip() {
    tooltipEl.classList.remove('visible');
  }

  function focusChip(id) {
    const el = chipMap.get(id);
    if (!el) return;
    chipMap.forEach(e => e.classList.remove('focused'));
    el.classList.add('focused');
    // Restart animation
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    // Scroll into view within the cloud
    const cloudRect = cloudEl.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    if (elRect.top < cloudRect.top + 16 || elRect.bottom > cloudRect.bottom - 16 ||
        elRect.left < cloudRect.left + 16 || elRect.right > cloudRect.right - 16) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    }
    setTimeout(() => el.classList.remove('focused'), 2200);
  }

  // ───── Search ─────
  /** @type {Term[]} */
  let currentResults = [];
  let activeResultIdx = -1;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const re = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
    return escapeHtml(text).replace(re, '<mark>$1</mark>');
  }

  function runSearch(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      currentResults = [];
      searchResultsEl.classList.remove('visible');
      searchClearEl.classList.remove('visible');
      return;
    }
    searchClearEl.classList.add('visible');
    currentResults = db.terms.filter(t =>
      t.term.toLowerCase().includes(q) ||
      t.description.toLowerCase().includes(q)
    );
    // Sort: term-match first, alphabetical
    currentResults.sort((a, b) => {
      const am = a.term.toLowerCase().includes(q) ? 0 : 1;
      const bm = b.term.toLowerCase().includes(q) ? 0 : 1;
      if (am !== bm) return am - bm;
      return a.term.localeCompare(b.term);
    });
    activeResultIdx = currentResults.length > 0 ? 0 : -1;
    renderSearchResults(query);
  }

  function renderSearchResults(query) {
    searchResultsEl.innerHTML = '';
    if (currentResults.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'search-empty';
      empty.innerHTML = '<strong>No matches</strong>Try a different search, or add this term.';
      searchResultsEl.appendChild(empty);
    } else {
      currentResults.forEach((t, i) => {
        const item = document.createElement('div');
        item.className = 'search-result' + (i === activeResultIdx ? ' active' : '');
        item.setAttribute('role', 'option');
        item.dataset.id = t.id;
        item.innerHTML =
          '<div class="search-result-term">' + highlight(t.term, query) + '</div>' +
          '<div class="search-result-desc">' + highlight(t.description, query) + '</div>';
        item.addEventListener('mousedown', (e) => { e.preventDefault(); selectResult(t.id); });
        searchResultsEl.appendChild(item);
      });
    }
    searchResultsEl.classList.add('visible');
  }

  function selectResult(id) {
    searchResultsEl.classList.remove('visible');
    searchEl.blur();
    focusChip(id);
  }

  searchEl.addEventListener('input', e => runSearch(e.target.value));
  searchEl.addEventListener('focus', () => {
    if (searchEl.value.trim()) {
      searchResultsEl.classList.add('visible');
    }
  });
  searchEl.addEventListener('blur', () => {
    setTimeout(() => searchResultsEl.classList.remove('visible'), 150);
  });
  searchEl.addEventListener('keydown', e => {
    if (!searchResultsEl.classList.contains('visible')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (currentResults.length === 0) return;
      activeResultIdx = (activeResultIdx + 1) % currentResults.length;
      renderSearchResults(searchEl.value);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (currentResults.length === 0) return;
      activeResultIdx = (activeResultIdx - 1 + currentResults.length) % currentResults.length;
      renderSearchResults(searchEl.value);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeResultIdx >= 0 && currentResults[activeResultIdx]) {
        selectResult(currentResults[activeResultIdx].id);
      }
    } else if (e.key === 'Escape') {
      searchEl.value = '';
      runSearch('');
      searchEl.blur();
    }
  });
  searchClearEl.addEventListener('click', () => {
    searchEl.value = '';
    runSearch('');
    searchEl.focus();
  });

  // ───── Add / Edit modal ─────
  const editModal = $('modal-edit');
  const editForm = $('form-edit');
  const editIdInput = $('edit-id');
  const editTermInput = $('edit-term');
  const editDescInput = $('edit-description');
  const editTitle = $('modal-edit-title');
  const errorTermEl = $('error-term');
  const errorDescEl = $('error-description');
  const fieldTermEl = $('field-term');
  const fieldDescEl = $('field-description');

  function openEditModal(term = null) {
    editIdInput.value = term ? term.id : '';
    editTermInput.value = term ? term.term : '';
    editDescInput.value = term ? term.description : '';
    editTitle.textContent = term ? 'Edit term' : 'Add term';
    clearFieldErrors();
    editModal.classList.add('visible');
    setTimeout(() => editTermInput.focus(), 50);
  }
  function clearFieldErrors() {
    fieldTermEl.classList.remove('has-error');
    fieldDescEl.classList.remove('has-error');
    errorTermEl.classList.remove('visible');
    errorDescEl.classList.remove('visible');
  }
  function setFieldError(field, msg) {
    if (field === 'term') {
      fieldTermEl.classList.add('has-error');
      errorTermEl.textContent = msg;
      errorTermEl.classList.add('visible');
    } else {
      fieldDescEl.classList.add('has-error');
      errorDescEl.textContent = msg;
      errorDescEl.classList.add('visible');
    }
  }

  editForm.addEventListener('submit', e => {
    e.preventDefault();
    clearFieldErrors();
    const id = editIdInput.value;
    const term = editTermInput.value.trim();
    const desc = editDescInput.value.trim();

    let hasError = false;
    if (!term) { setFieldError('term', 'Term is required'); hasError = true; }
    if (!desc) { setFieldError('description', 'Description is required'); hasError = true; }
    if (hasError) return;

    const existing = db.findByName(term);
    if (existing && existing.id !== id) {
      setFieldError('term', 'This term already exists');
      return;
    }

    if (id) {
      db.update(id, term, desc);
      toast('Updated "' + term + '"', 'success');
    } else {
      db.add(term, desc);
      toast('Added "' + term + '"', 'success');
    }
    closeAllModals();
    renderCloud();
    renderTermList();
  });

  $('btn-add').addEventListener('click', () => openEditModal(null));

  // ───── Manage modal ─────
  const manageModal = $('modal-manage');
  const termListEl = $('term-list');
  const termCountEl = $('term-count');

  function openManageModal() {
    renderTermList();
    manageModal.classList.add('visible');
  }
  function renderTermList() {
    termCountEl.textContent = db.terms.length;
    termListEl.innerHTML = '';
    if (db.terms.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'term-list-empty';
      empty.textContent = 'No terms yet. Click Add to create one.';
      termListEl.appendChild(empty);
      return;
    }
    const sorted = [...db.terms].sort((a, b) => a.term.localeCompare(b.term, undefined, { sensitivity: 'base' }));
    sorted.forEach(t => {
      const li = document.createElement('li');
      li.className = 'term-item';
      li.innerHTML =
        '<div class="term-item-main">' +
          '<div class="term-item-name"></div>' +
          '<div class="term-item-desc"></div>' +
        '</div>' +
        '<div class="term-item-actions">' +
          '<button class="btn btn-icon" data-edit aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
          '<button class="btn btn-icon btn-danger" data-delete aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
        '</div>';
      li.querySelector('.term-item-name').textContent = t.term;
      li.querySelector('.term-item-desc').textContent = t.description;
      li.querySelector('[data-edit]').addEventListener('click', () => {
        closeAllModals();
        openEditModal(t);
      });
      li.querySelector('[data-delete]').addEventListener('click', () => {
        if (confirm('Delete "' + t.term + '"?')) {
          db.remove(t.id);
          toast('Deleted "' + t.term + '"', 'success');
          renderCloud();
          renderTermList();
        }
      });
      termListEl.appendChild(li);
    });
  }

  $('btn-manage').addEventListener('click', openManageModal);

  // Export / Import
  $('btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ version: 1, terms: db.terms }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'acronymdb-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Exported ' + db.terms.length + ' term' + (db.terms.length === 1 ? '' : 's'), 'success');
  });
  $('btn-import').addEventListener('click', () => $('import-file').click());
  $('import-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const incoming = Array.isArray(data) ? data : (data && Array.isArray(data.terms) ? data.terms : null);
      if (!incoming) throw new Error('Invalid file format');
      let added = 0, skipped = 0;
      incoming.forEach(t => {
        if (!t || typeof t.term !== 'string' || typeof t.description !== 'string') { skipped++; return; }
        if (db.findByName(t.term)) { skipped++; return; }
        db.add(t.term, t.description);
        added++;
      });
      renderCloud();
      renderTermList();
      toast('Imported ' + added + ' term' + (added === 1 ? '' : 's') + (skipped ? ' (' + skipped + ' skipped)' : ''), 'success');
    } catch (err) {
      console.error(err);
      toast('Import failed: ' + err.message, 'error');
    } finally {
      e.target.value = '';
    }
  });

  // ───── Modal close handlers ─────
  function closeAllModals() {
    document.querySelectorAll('.modal-backdrop.visible').forEach(m => m.classList.remove('visible'));
  }
  document.querySelectorAll('[data-close-modal]').forEach(b => {
    b.addEventListener('click', closeAllModals);
  });
  document.querySelectorAll('.modal-backdrop').forEach(m => {
    m.addEventListener('click', e => {
      if (e.target === m) closeAllModals();
    });
  });
  document.addEventListener('keydown', e => {
    const editModalOpen = editModal.classList.contains('visible');
    const anyModalOpen = !!document.querySelector('.modal-backdrop.visible');

    if (e.key === 'Escape') {
      if (anyModalOpen) { closeAllModals(); return; }
      if (selection.size > 0) { clearSelection(); return; }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      searchEl.focus();
      searchEl.select();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && editModalOpen) {
      e.preventDefault();
      editForm.requestSubmit ? editForm.requestSubmit() : editForm.dispatchEvent(new Event('submit', { cancelable: true }));
      return;
    }

    // Single-key shortcuts only when not typing in a field and no modal is open
    if (anyModalOpen) return;
    const tgt = e.target;
    const tag = tgt && tgt.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || (tgt && tgt.isContentEditable);
    if (typing) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key === 'a' || e.key === 'A') {
      e.preventDefault();
      openEditModal(null);
    }
  });

  // ───── Toast ─────
  let toastTimer = null;
  function toast(msg, kind = 'success') {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + kind + ' visible';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2200);
  }

  // ───── Resize: reclamp positions to new bounds ─────
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const { w, h } = getCloudSize();
      chipMap.forEach((el, id) => {
        const cw = el.offsetWidth, ch = el.offsetHeight;
        const curX = parseFloat(el.style.left) || 0;
        const curY = parseFloat(el.style.top) || 0;
        const x = clamp(curX, 0, Math.max(0, w - cw));
        const y = clamp(curY, 0, Math.max(0, h - ch));
        if (x !== curX || y !== curY) {
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          db.setPosition(id, x, y);
        }
      });
      labelMap.forEach((el, id) => {
        const cw = el.offsetWidth, ch = el.offsetHeight;
        const curX = parseFloat(el.style.left) || 0;
        const curY = parseFloat(el.style.top) || 0;
        const x = clamp(curX, 0, Math.max(0, w - cw));
        const y = clamp(curY, 0, Math.max(0, h - ch));
        if (x !== curX || y !== curY) {
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          db.setLabelPosition(id, x, y);
        }
      });
    }, 150);
  });

  // ───── Theme ─────
  const THEME_KEY = 'acronymdb:theme';
  function applyTheme(theme) {
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  function getStoredTheme() {
    try { return localStorage.getItem(THEME_KEY); } catch (_) { return null; }
  }
  function setStoredTheme(theme) {
    try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
  }
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }
  $('btn-theme').addEventListener('click', () => {
    const next = currentTheme() === 'light' ? 'dark' : 'light';
    applyTheme(next);
    setStoredTheme(next);
  });
  // Follow system changes only when the user hasn't explicitly chosen
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    mq.addEventListener && mq.addEventListener('change', e => {
      if (!getStoredTheme()) applyTheme(e.matches ? 'light' : 'dark');
    });
  }

  // ───── Boot ─────
  db.load();
  renderCloud();
})();
</script>
</body>
</html>
