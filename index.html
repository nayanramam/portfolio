<!DOCTYPE html>
<html lang="en" class="modern">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nayan Ramam</title>
    <meta name="description" content="Nayan Ramam, electrical engineering at Georgia Tech. Analog mixed-signal design, audio, and machine learning, displayed on a vintage bench oscilloscope.">
    <meta name="theme-color" content="#24282e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- ?v= is bumped whenever the code changes so browsers fetch the new version (content/*.md is always fetched fresh) -->
    <link rel="stylesheet" href="assets/scope/scope.css?v=202611171700">
    <link rel="stylesheet" href="assets/scope/modern.css?v=202611171700">
    <!-- plain pass: removes AI-looking styling habits; delete this line to undo it -->
    <link rel="stylesheet" href="assets/scope/plain.css?v=202611171700">
    <!-- display style: modern (default) or vintage; ?look=modern|vintage sets and remembers it -->
    <script>try { var q = new URLSearchParams(location.search).get('look'); if (q === 'modern' || q === 'vintage') localStorage.setItem('nr.look', q); if ((q || localStorage.getItem('nr.look')) === 'vintage') document.documentElement.classList.remove('modern'); } catch (e) {}</script>
</head>
<body class="off">
    <noscript><p style="color:#ddd;font:16px sans-serif;padding:20px">This page is an oscilloscope that needs JavaScript to run.</p></noscript>

    <main class="scope" id="scope">
        <span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span>
        <div class="face">


            <!-- ============ the CRT ============ -->
            <div class="screen-area">
                <div class="bezel">
                    <div class="brand">
                        <div class="plate"><i class="rivet"></i><span class="inst" id="nameplate"></span><i class="rivet"></i></div>
                        <div class="look" role="group" aria-label="Display style"><button type="button" data-look="modern" aria-pressed="true">Modern</button><button type="button" data-look="vintage" aria-pressed="false">Vintage</button></div>
                    </div>
                    <div class="crt" id="crt">
                        <div class="tube" id="tube">
                            <canvas id="grat" aria-hidden="true"></canvas>

                            <div id="view" tabindex="0" aria-label="Oscilloscope screen" aria-live="polite">

                                <!-- Every screen is filled in from the markdown in content/ (see content/README.md) -->
                                <section class="scr home" id="s-xy" hidden>
                                    <div class="sig" id="sig" role="img"><h1 class="sr-only" id="home-name"></h1></div>
                                    <p class="sub" id="home-tagline"></p>
                                    <div class="rest">
                                        <div class="hero">
                                            <figure class="phos photo"><img id="home-photo" src="" alt=""></figure>
                                            <div class="intro">
                                                <div class="intro-rows" id="home-specs"></div>
                                                <nav class="intro-links" aria-label="Sections">
                                                    <button type="button" data-go="ch1">Projects</button>
                                                    <button type="button" data-go="ch2">Experience</button>
                                                    <a href="#" target="_blank" rel="noopener" data-print>Resume</a>
                                                    <button type="button" data-go="probe">Contact</button>
                                                </nav>
                                            </div>
                                        </div>
                                        <div class="xp-tiles" id="home-xp"></div>
                                        <div class="bench" id="home-bench"></div>
                                        <div class="fullbio" id="home-full"><div class="md" id="home-bio"></div></div>
                                    </div>
                                </section>

                                <section class="scr" id="s-ch1" hidden>
                                    <h2>CH1 · Projects <span class="hint">select a capture</span></h2>
                                    <div class="caps" id="caps"></div>
                                </section>
                                <section class="scr pd" id="s-proj" hidden></section>

                                <section class="scr" id="s-ch2" hidden>
                                    <h2>CH2 · Experience <span class="hint">hover a pulse · click for the write-up</span></h2>
                                    <div class="tl">
                                        <div class="tl-lanes" id="tl-lanes" aria-hidden="true"></div>
                                        <div class="tl-scroll" id="tl-scroll"></div>
                                    </div>
                                    <div class="caps xps" id="xps"></div>
                                </section>
                                <section class="scr pd" id="s-doc" hidden></section>

                                <section class="scr" id="s-ch3" hidden></section>
                                <section class="scr" id="s-ch4" hidden></section>
                                <section class="scr" id="s-probe" hidden></section>
                            </div>

                            <canvas id="beam" aria-hidden="true"></canvas>
                            <div class="ro tl" id="ro-tl"></div>
                            <div class="ro tr" id="ro-tr"></div>
                            <div class="ro bl" id="ro-bl"></div>
                            <div class="ro br" id="ro-br"></div>
                            <div id="more" hidden aria-hidden="true">▼</div>
                            <div id="flash" aria-hidden="true"></div>
                            <div class="pop" id="dishpop" role="tooltip" hidden><div class="ph"><span>CH4 · DISH</span><span id="dp-n"></span></div><div class="pt" id="dp-t"></div><div class="pd" id="dp-d"></div><i class="lead"></i></div>
                        </div>

                        <div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="pl-title">
                            <div class="pl-box">
                                <div class="pl-head"><span id="pl-title"></span><button class="soft" type="button" id="pl-close">✕ Close</button></div>
                                <div class="pl-frame" id="pl-frame"></div>
                            </div>
                        </div>
                        <button id="skip" type="button" hidden>SKIP ▸▸</button>
                        <div class="glass" aria-hidden="true"></div>
                    </div>
                </div>
            </div>

            <!-- ============ under the screen ============ -->
            <div class="under">
                <div class="u-side u-left">
                <button class="power" id="power" type="button" aria-pressed="false" aria-label="Power">
                    <span class="pw"><span class="lamp"></span><span class="sw"></span></span>
                    <span class="lab silk">Power</span>
                </button>
                <div class="knob-w" data-knob="intensity" data-size="sm"></div>
                <div class="knob-w" data-knob="focus" data-size="sm"></div>
                <button class="key sound" id="sound" type="button" aria-pressed="false" aria-label="Sound (off)" title="Panel sounds (off by default)">
                    <span class="led"></span>
                    <span class="well"><span class="cap" style="width:38px;height:26px"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5c1 .8 1 4.2 0 5M12.8 4c1.8 1.6 1.8 6.4 0 8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span></span>
                    <span class="sub">Sound</span>
                </button>
                </div>
                <div class="keys" role="group" aria-label="Channels">
                    <button class="key dark" type="button" data-go="xy" aria-pressed="false" title="Home (X)"><span class="led"></span><span class="well"><span class="cap">HOME</span></span><span class="sub">About</span></button>
                    <button class="key" type="button" data-go="ch1" aria-pressed="false" title="Projects (1)"><span class="led"></span><span class="well"><span class="cap">CH1</span></span><span class="sub">Projects</span></button>
                    <button class="key" type="button" data-go="ch2" aria-pressed="false" title="Experience (2)"><span class="led"></span><span class="well"><span class="cap">CH2</span></span><span class="sub">Experience</span></button>
                    <button class="key" type="button" data-go="ch3" aria-pressed="false" title="Education (3)"><span class="led"></span><span class="well"><span class="cap">CH3</span></span><span class="sub">Education</span></button>
                    <button class="key" type="button" data-go="ch4" aria-pressed="false" title="Beyond engineering (4)"><span class="led"></span><span class="well"><span class="cap">CH4</span></span><span class="sub">Beyond Eng.</span></button>
                    <button class="key dark" type="button" data-go="probe" aria-pressed="false" title="Contact (P)"><span class="led"></span><span class="well"><span class="cap">PROBE</span></span><span class="sub">Contact</span></button>
                    <a class="key dark print" href="#" target="_blank" rel="noopener" data-print title="Resume PDF"><span class="led"></span><span class="well"><span class="cap">PRINT</span></span><span class="sub">Resume</span></a>
                </div>
                <div class="u-side u-right">
                <div class="legend" aria-label="Keyboard shortcuts">
                    <span class="lt ink">Keyboard</span>
                    <span class="li"><kbd>1</kbd>–<kbd>4</kbd><span class="ink">Channels</span></span>
                    <span class="li"><kbd>X</kbd><span class="ink">Home</span></span>
                    <span class="li"><kbd>P</kbd><span class="ink">Contact</span></span>
                </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="assets/scope/content.js?v=202611171700"></script>
    <script src="assets/scope/scope.js?v=202611171700"></script>
</body>
</html>
