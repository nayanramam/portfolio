<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chud Tier List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #111;
    color: #fff;
    overflow: hidden;
  }
  .page {
    max-width: 1100px;
    height: 100%;
    margin: 0 auto;
    padding: 10px 14px 8px;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .description {
    font-size: 0.72rem;
    color: #666;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .header-links {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn-link {
    color: #fff;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 11px;
    border: 2px solid #fff;
    background: transparent;
    transition: background 0.15s, color 0.15s;
  }
  .btn-link:hover {
    background: #fff;
    color: #111;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 210px;
    gap: 10px;
    flex: 1;
    min-height: 0;
    align-items: stretch;
  }
  .tierlist {
    border: 2px solid #000;
    background: #000;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }
  .tier-row {
    display: grid;
    grid-template-columns: 52px 1fr;
    border-bottom: 2px solid #000;
    flex: 1;
    min-height: 0;
  }
  .tier-row:last-child { border-bottom: none; }
  .tier-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.45rem;
    font-weight: 800;
    color: #000;
    border-right: 2px solid #000;
  }
  .tier-content {
    background: #1a1a1a;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    padding: 4px 6px;
    min-height: 0;
    overflow: hidden;
  }
  .person {
    width: 58px;
    text-align: center;
    flex-shrink: 0;
  }
  .person img {
    width: 58px;
    height: 58px;
    object-fit: cover;
    border: 2px solid #333;
    display: block;
    background: #2a2a2a;
  }
  .person-name {
    font-size: 0.58rem;
    color: #aaa;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .feed {
    border: 2px solid #333;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
  }
  .feed-header {
    padding: 7px 10px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #888;
    border-bottom: 2px solid #333;
  }
  .feed-list {
    list-style: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .feed-item {
    padding: 7px 10px;
    border-bottom: 1px solid #2a2a2a;
    font-size: 0.72rem;
    line-height: 1.35;
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-item .name { font-weight: 700; color: #fff; }
  .feed-item .move { color: #ccc; }
  .feed-item .up { color: #7dffb2; }
  .feed-item .down { color: #ff8f8f; }
  .feed-item .by { color: #666; font-size: 0.65rem; margin-top: 1px; }
  .feed-empty {
    padding: 10px;
    color: #666;
    font-size: 0.72rem;
  }
  .status {
    font-size: 0.62rem;
    color: #444;
    margin-top: 4px;
    flex-shrink: 0;
    text-align: right;
  }
  .status.error { color: #ff8f8f; }
  @media (max-width: 800px) {
    body { overflow: auto; }
    .page { height: auto; min-height: 100%; }
    .layout { grid-template-columns: 1fr; flex: none; }
    .tierlist { height: auto; }
    .tier-row { flex: none; min-height: 72px; }
    .feed { height: auto; max-height: 200px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>chud tier list</h1>
    <div class="header-links">
      <a class="btn-link" href="/sbc/vote/">Vote</a>
    </div>
  </header>
  <div class="description">how often you fade us</div>

  <div class="layout">
    <div class="tierlist" id="tierlist"></div>

    <aside class="feed">
      <div class="feed-header">Recent Activity</div>
      <ul class="feed-list" id="feed-list">
        <li class="feed-empty">Loading…</li>
      </ul>
    </aside>
  </div>

  <p class="status" id="status"></p>
</div>

<script>
const TIERS = ['S', 'A', 'B', 'C', 'D', 'F'];
const TIER_COLORS = {
  S: '#FF7F7F',
  A: '#FFBF7F',
  B: '#FFDF7F',
  C: '#FFFF7F',
  D: '#BFFF7F',
  F: '#7FBFFF',
};

const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://127.0.0.1:8787/api/sbc'
  : '/api/sbc';

function renderTierlist(tiers) {
  const el = document.getElementById('tierlist');
  el.innerHTML = TIERS.map((tier) => {
    const people = tiers[tier] || [];
    const cards = people.map((p) => `
      <div class="person" title="${escapeHtml(p.name)}">
        <img src="${escapeAttr(p.photo_url)}" alt="${escapeAttr(p.name)}" loading="lazy">
        <div class="person-name">${escapeHtml(p.name)}</div>
      </div>
    `).join('');
    return `
      <div class="tier-row">
        <div class="tier-label" style="background:${TIER_COLORS[tier]}">${tier}</div>
        <div class="tier-content">${cards}</div>
      </div>
    `;
  }).join('');
}

function renderFeed(activity) {
  const el = document.getElementById('feed-list');
  if (!activity || activity.length === 0) {
    el.innerHTML = '<li class="feed-empty">No tier changes yet.</li>';
    return;
  }
  el.innerHTML = activity.map((item) => {
    const arrow = item.direction === 'up' ? '↑' : '↓';
    const dirClass = item.direction === 'up' ? 'up' : 'down';
    const time = formatTime(item.created_at);
    return `
      <li class="feed-item">
        <div><span class="name">${escapeHtml(item.person_name)}</span>
          <span class="move ${dirClass}">${escapeHtml(item.from_tier)} → ${escapeHtml(item.to_tier)} ${arrow}</span></div>
        <div class="by">by ${escapeHtml(item.triggered_by)} · ${time}</div>
      </li>
    `;
  }).join('');
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
  if (isNaN(d)) return iso;
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escapeAttr(str) {
  return escapeHtml(str);
}

async function fetchState() {
  const status = document.getElementById('status');
  try {
    const res = await fetch(API_BASE + '/state');
    if (!res.ok) throw new Error('Failed to load (' + res.status + ')');
    const data = await res.json();
    renderTierlist(data.tiers);
    renderFeed(data.activity);
    status.textContent = 'Updated ' + new Date().toLocaleTimeString();
    status.classList.remove('error');
  } catch (err) {
    status.textContent = err.message || 'Could not reach API';
    status.classList.add('error');
  }
}

fetchState();
setInterval(fetchState, 15000);
</script>
</body>
</html>
